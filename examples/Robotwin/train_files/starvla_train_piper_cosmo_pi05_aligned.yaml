# CosmoPredict2 + Piper fold — aligned with openpi pi05_flatten_v2 conventions.
#
# Key differences from the previous cosmo full-FT run (starvla_train_arx.yaml):
#   - include_state: true          (pi05 uses proprio)
#   - data_mix: arx_x5_pi05        (q99 normalization like openpi norm_stats)
#   - shorter schedule (~15k)      (pi05_flatten_v2 checkpoints: 5k / 10k / 15k)
#   - CosmoPredict2GR00T default   (flow-matching head; try before slow CosmoPredict2PI)
#
# Dataset: same LeRobot repo Ishan-Axibo/piperx_fold under playground/Datasets/arx-x5

run_id: piperx_fold_cosmo_gr00t_pi05_align
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starvla-piper
is_debug: false
version_id: "0.21"

framework:
  name: CosmoPredict2GR00T
  world_model:
    base_wm: ./playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
    extract_layers: [-1]
  qwenvl:
    base_vlm: ./playground/Pretrained_models/nvidia/Cosmos-Predict2-2B-Video2World
    vl_hidden_dim: 2048

  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    repeated_diffusion_steps: 4
    num_inference_timesteps: 10
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/arx-x5
    data_mix: arx_x5_pi05
    action_type: abs_qpos
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    num_workers: 0

trainer:
  max_train_steps: 15000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 500
  learning_rate:
    base: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
